name: dhallah_app
description: "Graduation Project 2"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase Dependencies
  firebase_core: ^3.0.0
  cloud_firestore: ^5.0.2
  firebase_storage: ^12.0.0
  firebase_auth: ^5.0.0

  # Location and Maps
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  flutter_map: any
  latlong2: any

  # Image and Network
  image_picker: ^1.1.2
  http: ^1.2.0
  cached_network_image: ^3.3.1

  # Utilities
  change_app_package_name: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0 # تم تحديث الإصدار ليتوافق مع البيئة

flutter:
  uses-material-design: true

